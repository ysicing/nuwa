name: Build Installer

on:
  push:
    branches: [master, main]
    paths:
      - 'api/**'
      - 'internal/**'
      - 'cmd/**'
      - 'config/**'
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

env:
  GO_VERSION: '1.25'

jobs:
  build-installer:
    name: Build Installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build installer manifest
        run: make build-installer IMG=ghcr.io/ysicing/nuwa:latest

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update install.yaml'
          title: 'chore: update install.yaml'
          body: |
            Auto-generated installer manifest update.

            This PR was automatically created by the build-installer workflow.
          branch: chore/update-install-yaml
          delete-branch: true
          labels: automated
          add-paths: dist/install.yaml
