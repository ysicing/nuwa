name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
    paths-ignore:
      - 'dist/install.yaml'
  pull_request:
    branches: [master, main]
    paths-ignore:
      - 'dist/install.yaml'

env:
  GO_VERSION: '1.25'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests
        run: make test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binaries
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -a -o bin/manager-linux-amd64 cmd/main.go
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -a -o bin/manager-linux-arm64 cmd/main.go
          chmod +x bin/manager-*

      - name: Set up QEMU
        if: github.event_name == 'push'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build installer manifest
        if: github.event_name == 'push'
        run: make build-installer IMG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Upload installer manifest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: install-yaml
          path: dist/install.yaml
          retention-days: 7

  update-installer:
    name: Update Installer
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Download installer manifest
        uses: actions/download-artifact@v4
        with:
          name: install-yaml
          path: dist/

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update install.yaml'
          title: 'chore: update install.yaml'
          body: |
            Auto-generated installer manifest update.

            This PR was automatically created by the CI workflow.
          branch: chore/update-install-yaml
          delete-branch: true
          labels: automated
          add-paths: dist/install.yaml

  e2e:
    name: E2E Test
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Download installer manifest
        uses: actions/download-artifact@v4
        with:
          name: install-yaml
          path: dist/

      - name: Create Kind cluster
        uses: helm/kind-action@v1

      - name: Install OpenKruise
        run: |
          helm repo add openkruise https://openkruise.github.io/charts/
          helm install kruise openkruise/kruise --version 1.8.0 \
            --set daemon.socketLocation=/run/containerd/containerd.sock \
            --wait

      - name: Deploy Nuwa
        run: |
          kubectl apply -f dist/install.yaml
          kubectl -n nuwa-system wait --for=condition=available deployment/nuwa-controller-manager --timeout=120s

      - name: Run E2E tests
        run: |
          kubectl apply -f config/samples/app_v1_nuwa.yaml
          sleep 10
          kubectl get nuwa
          kubectl get cloneset
          kubectl get svc
