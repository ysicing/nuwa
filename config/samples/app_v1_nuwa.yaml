apiVersion: app.12306.work/v1
kind: Nuwa
metadata:
  labels:
    app.kubernetes.io/name: nuwa
    app.kubernetes.io/managed-by: kustomize
  name: nuwa-sample
spec:
  # Container image (required)
  image: nginx:latest

  # Number of replicas
  replicas: 2

  # Environment variables
  env:
    - name: TZ
      value: Asia/Shanghai

  # Port mappings (will create Service automatically)
  ports:
    - name: http
      containerPort: 80
      servicePort: 80

  # Service configuration (optional)
  service:
    type: ClusterIP  # ClusterIP, NodePort, LoadBalancer

  # Resource presets (optional, defaults to none)
  # resourcesPreset: small  # none, nano, micro, small, medium, large, xlarge, xxlarge
  # resourcesOvercommit: low  # none, low, high

  # Or use explicit resource limits (takes priority over presets)
  # resources:
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi
  #   limits:
  #     cpu: 500m
  #     memory: 512Mi

  # Storage configuration (optional)
  # Type: PVC (default), EmptyDir, HostPath
  # storage:
  #   type: PVC
  #   size: 10Gi
  #   mountPath: /data
  #   storageClassName: standard
  #   retainPolicy: Retain  # Retain (default) or Delete

  # EmptyDir example:
  # storage:
  #   type: EmptyDir
  #   mountPath: /tmp/cache
  #   size: 1Gi  # optional size limit

  # HostPath example:
  # storage:
  #   type: HostPath
  #   mountPath: /data
  #   hostPath: /mnt/data
  #   hostPathType: DirectoryOrCreate
