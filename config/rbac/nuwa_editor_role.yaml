# This rule is not used by the project nuwa itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the app.12306.work.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: nuwa
    app.kubernetes.io/managed-by: kustomize
  name: nuwa-editor-role
rules:
- apiGroups:
  - app.12306.work
  resources:
  - nuwas
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - app.12306.work
  resources:
  - nuwas/status
  verbs:
  - get
